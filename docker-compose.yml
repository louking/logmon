# see .env for image version env variables
# see repo/settings/environments for image version env variables for github actions
x-app-env: &app-env
  TZ: ${TZ}
  APP_VER: ${APP_VER}
  APP_NAME: ${APP_NAME}
  APP_DATABASE: ${APP_DATABASE}
  APP_USER: ${APP_DATABASE}
  APP_PASSWORD_FILE: /run/secrets/appdb-password
  FLASK_DEBUG: ${FLASK_DEBUG}
  FLASK_LOGGING_PATH: ${FLASK_LOGGING_PATH}

services:
  db:
    # https://github.com/docker-library/mysql/issues/275#issuecomment-636831964
    image: mysql:${MYSQL_VER}
    # # changed in mysql 8.4
    # command: --mysql-native-password=ON
    command: '--default-authentication-plugin=mysql_native_password'
    # command: '--default-authentication-plugin=mysql_native_password --log_error_verbosity=3' # mysql
    restart: always
    # ports can be removed when all apps are under docker control
    secrets:
      - root-password
      - appdb-password
    volumes:
      - db-data:/var/lib/mysql
      - ${VAR_LOG_HOST}:/var/log
    networks:
      - backend-network
    environment:
      - TZ=${TZ}
      - MYSQL_DATABASE=${APP_DATABASE}
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/root-password
      - MYSQL_USER=${APP_DATABASE}
      - MYSQL_PASSWORD_FILE=/run/secrets/appdb-password

  # ------------------------------------------------------------------ redis
  # Shared tail buffer between the follower and app services.
  # Data is ephemeral (no persistence needed — it's a live-tail buffer).
  redis:
    image: redis:${REDIS_VER}-alpine
    restart: unless-stopped
    networks:
      - backend-network

  web:
    image: louking/${APP_NAME}-web:${APP_VER}
    build: 
      context: web
      args:
        - NGINX_VER=${NGINX_VER}
        - PHPMYADMIN_VER=${PHPMYADMIN_VER}
    restart: always
    networks:
      - frontend-network
    volumes:
      - ${VAR_LOG_HOST}:/var/log
    environment:
      TZ: ${TZ}
    ports:
      - ${APP_PORT}:80
    # uncomment to debug
    # command: [nginx-debug, '-g', 'daemon off;']

  phpmyadmin:
    image: phpmyadmin:${PHPMYADMIN_VER}-fpm
    restart: always
    depends_on:
      - db
    networks:
      - backend-network
      - frontend-network
    volumes:
      - ${VAR_LOG_HOST}:/var/log
    environment:
      TZ: ${TZ}
      PMA_ABSOLUTE_URI: http://phpmyadmin/phpmyadmin

  # ------------------------------------------------------------------ app
  # Serves the dashboard UI and SNS webhook.
  # Scaled freely (--workers N in gunicorn) without spawning extra followers.
  # Does NOT need access to the host log directories.
  app:
    image: louking/${APP_NAME}-app:${APP_VER}
    build: &app-build
      context: app
      args:
        PYTHON_VER: ${PYTHON_VER}
        APP_DATABASE: ${APP_DATABASE}
    restart: always
    depends_on:
      - db
      - redis
    secrets:
        - root-password
        - users-password
        - appdb-password
        - mail-password
        - sns-webhook-key
    networks:
      - backend-network
      - frontend-network
    volumes:
      - ./config:/config:ro
      - ${DB_INIT_DIR}:/initdb.d
      - ${APP_LOGGING_HOST}:${APP_LOGGING_PATH}
    environment: 
      <<: *app-env
    extra_hosts:
      # see https://stackoverflow.com/a/67158212/799921
      - "host.docker.internal:host-gateway"
    # --timeout 120 increases default, required for task details and member summary views -- matches nginx.conf proxy_read_timeout
    command: ["./dbupgrade_and_run.sh", "gunicorn", "--reload", "--bind", "0.0.0.0:5000", "--log-level", "info", 
              "--workers=${GUNICORN_WORKERS}", "--threads=${GUNICORN_THREADS}", "--worker-class", "gevent", 
              "--access-logfile", "${ACCESS_LOG}", "--access-logformat", '%({x-forwarded-for}i)s %(l)s %(u)s %(t)s "%(r)s" %(s)s %(b)s "%(f)s" "%(a)s"', 
              "--timeout", "120", "app_server:app"]

  # ------------------------------------------------------------------ follower
  # Tails log files and writes events + alerts to the DB.
  # Runs as a single instance so there is exactly one set of follower threads.
  # This is the only service that needs the host log directory mounts —
  # those are added in the gitignored docker-compose.override.yml.
  follower:
    image: louking/${APP_NAME}-app:${APP_VER}
    build: *app-build
    restart: unless-stopped
    secrets:
        - users-password
        - appdb-password
        - mail-password
    networks:
      - backend-network
    volumes:
      - ./config:/config:ro
      - ${VAR_LOG_HOST}:/var/log
      # Host log directory mounts are added in docker-compose.override.yml
    depends_on:
      - db
      - redis
    environment: 
      <<: *app-env
    extra_hosts:
      # see https://stackoverflow.com/a/67158212/799921
      - "host.docker.internal:host-gateway"
    # command: flask follower run
    command: flask run-follower

  # ------------------------------------------------------------------ crond
  # Runs cron jobs for maintenance tasks like database backups and log pruning.
  crond:
    image: louking/${APP_NAME}-app:${APP_VER}
    user: root
    build: *app-build
    restart: always
    depends_on:
      - db
    networks:
      - backend-network
    secrets:
      - root-password
      - users-password
      - appdb-password
    volumes:
      - ./config:/config:ro
      - ./config/msmtprc:/etc/msmtprc:ro
      - ./config/cronjobs:/etc/crontabs/appuser
      - ${DB_INIT_DIR}:/initdb.d
      - ${VAR_LOG_HOST}:/var/log
      - ${BACKUP_FOLDER_HOST}/${APP_DATABASE}:/backup
    environment: 
      <<: *app-env
    # start crond with log level 8 in foreground, output to stderr
    command: ["crond", "-f", "-d", "8"]

volumes:
  db-data:

secrets:
  root-password:
    file: config/db/root-password.txt
  users-password:
    file: config/db/users-password.txt
  appdb-password:
    file: config/db/appdb-password.txt
  mail-password:
    file: config/mail-password.txt
  sns-webhook-key:
    file: config/sns-webhook-key.txt

networks:
  backend-network:
  frontend-network:
